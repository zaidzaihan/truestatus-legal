<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · TrueStatus</title>
<style>
  :root { --bg:#fbfaff; --fg:#1d1726; --muted:#5d5470; --accent:#6b45c9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16121d; --fg:#f1edf7; --muted:#b4abc4; --accent:#bfa2ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:680px; margin:0 auto; padding:40px 20px 64px; }
  h1 { font-size:2rem; line-height:1.2; margin:0 0 8px; }
  h2 { font-size:1.2rem; margin:2em 0 .5em; }
  p, li { color:var(--muted); }
  strong { color:var(--fg); }
  a { color:var(--accent); }
  footer { margin-top:48px; font-size:.9rem; color:var(--muted); }
</style>
</head>
<body><main>
{{ content }}
<footer>TrueStatus by Veilyo Studio · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a></footer>
